<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Estúdio Megadino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<style>
/* Card dividido: à esquerda o degradê da marca (brasa Megadino) com a logo, à direita o formulário claro. */
body{display:grid;place-items:center;padding:24px 16px}
.auth{width:100%;max-width:1060px;min-height:640px;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);
  background:#fff;border-radius:30px;padding:10px;box-shadow:0 40px 120px -40px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.06)}

/* ---- Lado da marca ---- */
.show{position:relative;overflow:hidden;border-radius:22px;color:#fff;display:grid;place-items:center;padding:34px;isolation:isolate;
  background:
    radial-gradient(480px 380px at 12% 8%,rgba(255,176,64,.85),rgba(255,176,64,0) 60%),
    radial-gradient(520px 460px at 92% 96%,rgba(90,6,10,.95),rgba(90,6,10,0) 65%),
    radial-gradient(420px 360px at 70% 30%,rgba(255,90,60,.55),rgba(255,90,60,0) 70%),
    linear-gradient(150deg,#FF8A1F 0%,#F0452F 42%,#B3171B 72%,#3A0708 100%)}
.show::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:20px 20px;
  mask-image:radial-gradient(circle at 60% 40%,#000 0,transparent 75%);-webkit-mask-image:radial-gradient(circle at 60% 40%,#000 0,transparent 75%)}
.show img{width:min(62%,340px);height:auto;filter:drop-shadow(0 12px 30px rgba(0,0,0,.45))}

/* ---- Formulário (claro) ---- */
.form{--panel-2:#F6F5F3;--fg:#15130F;--muted:#6E6A63;--line:#E4E1DB;--line-2:#CFCAC2;color-scheme:light;
  color:var(--fg);display:flex;flex-direction:column;justify-content:center;gap:22px;padding:40px clamp(24px,5vw,64px)}
.form .logo{height:34px;width:auto;align-self:center}
.form h1{font-family:var(--font-ui);font-weight:700;font-size:30px;letter-spacing:-.4px;text-align:center}
.form .sub{text-align:center;color:var(--muted);margin-top:-12px}
form{display:flex;flex-direction:column;gap:16px}
.pw{position:relative}
.pw input{padding-right:48px!important}
.eye{position:absolute;right:6px;top:50%;translate:0 -50%;width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye:hover{color:var(--fg);background:rgba(0,0,0,.05)}
.eye:focus-visible{outline:2px solid #F0452F;outline-offset:1px}
.eye svg{width:20px;height:20px}
.form .btn{width:100%;padding:15px 18px;font-size:16px;margin-top:4px}
.form .msg.err{color:#B3171B;background:#FDECEA;border-color:#F6C9C2}
.hint{font-size:13.5px;text-align:center;color:var(--muted)}
.social{display:flex;justify-content:center;align-items:center;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.social a{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--fg);text-decoration:none;padding:8px 12px;border-radius:999px;margin-top:12px}
.social a:hover{background:var(--panel-2)}
.social svg{width:18px;height:18px}

@media (max-width:860px){
  body{padding:12px;place-items:start center}
  .auth{grid-template-columns:minmax(0,1fr);min-height:0;border-radius:24px;padding:8px}
  .show{padding:22px;min-height:180px}
  .show img{width:min(60%,240px)}
  .form .logo{display:none}
  .form{padding:28px 18px 18px}
}
</style>
</head>
<body>
<main class="auth">
  <section class="show" aria-hidden="true">
    <img src="/assets/megadino-logo-branca.png" alt="">
  </section>

  <section class="form">
    <img class="logo" src="/assets/megadino-logo-preta.png" alt="Megadino">
    <h1>Entrar no Estúdio</h1>
    <p class="sub">Use o e-mail e a senha que o administrador cadastrou.</p>
    <form id="f">
      <label class="f" for="email">E-mail<input type="email" id="email" autocomplete="username" placeholder="seu@email.com" required></label>
      <label class="f" for="password">Senha
        <span class="pw"><input type="password" id="password" autocomplete="current-password" placeholder="Sua senha" required>
        <button class="eye" id="eye" type="button" aria-label="Mostrar senha" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="eyeSlash" d="M4 4l16 16"/></svg>
        </button></span>
      </label>
      <button class="btn" id="go" type="submit">Entrar</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
    <p class="hint">Esqueceu a senha? Peça ao administrador para redefinir.</p>
    <div class="social">
      <a href="https://www.instagram.com/loja_megadino/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        @loja_megadino
      </a>
    </div>
  </section>
</main>
<script src="/assets/common.js"></script>
<script>
const pw = document.getElementById('password'), eye = document.getElementById('eye');
eye.addEventListener('click', () => {
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  eye.setAttribute('aria-pressed', show); eye.setAttribute('aria-label', show ? 'Esconder senha' : 'Mostrar senha');
  document.getElementById('eyeSlash').style.display = show ? 'none' : '';
});
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg'), go = document.getElementById('go');
  go.disabled = true; msg.className = 'msg'; msg.textContent = 'Entrando…';
  try {
    const r = await Estudio.api('/api/auth/login', { method: 'POST', body: { email: document.getElementById('email').value, password: pw.value } });
    location.href = r.mustChange ? '/conta?primeiro=1' : '/';
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = err.message; go.disabled = false;
  }
});
</script>
</body>
</html>
