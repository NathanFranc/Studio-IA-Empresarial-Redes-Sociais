<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Estúdio Megadino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.logo{height:44px;width:auto;align-self:center}
.logo.d{display:none}
@media (prefers-color-scheme: dark){.logo.l{display:none}.logo.d{display:block}}
h1{text-align:center;font-size:34px}
h1 span{color:var(--accent)}
form{display:flex;flex-direction:column;gap:14px}
.hint{font-size:13px;text-align:center}
</style>
</head>
<body>
<main class="box">
  <img class="logo l" src="/assets/megadino-logo-preta.png" alt="Megadino">
  <img class="logo d" src="/assets/megadino-logo-branca.png" alt="Megadino">
  <h1>Estúdio <span>Megadino</span></h1>
  <form class="panel" id="f">
    <label class="f" for="email">E-mail<input type="email" id="email" autocomplete="username" required></label>
    <label class="f" for="password">Senha<input type="password" id="password" autocomplete="current-password" required></label>
    <button class="btn" id="go" type="submit">Entrar</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
  <p class="hint muted">Esqueceu a senha? Peça ao administrador para redefinir.</p>
</main>
<script src="/assets/common.js"></script>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg'), go = document.getElementById('go');
  go.disabled = true; msg.className = 'msg'; msg.textContent = 'Entrando…';
  try {
    const r = await Estudio.api('/api/auth/login', { method: 'POST', body: { email: document.getElementById('email').value, password: document.getElementById('password').value } });
    location.href = r.mustChange ? '/conta?primeiro=1' : '/';
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = err.message; go.disabled = false;
  }
});
</script>
</body>
</html>
